<div id="farm-crops-third">
 <div class="viz-controls">
  <label class="form-label">Croissance · <span data-age>100 %</span><input class="form-range" data-growth type="range" min="0" max="100" value="100" step="0.1" aria-label="Croissance des cultures"></label>
  <button class="btn" type="button" data-play>Voir la pousse</button>
  <label class="form-check"><input class="form-check-input" type="checkbox" data-wind checked><span class="form-check-label">Vent doux →</span></label>
 </div>
 <div class="crop-row"><div>Courgettes</div><canvas width="360" height="90" role="img" aria-label="Quatre courgettes aux grandes feuilles et aux fruits allongés striés."></canvas></div>
 <div class="crop-row"><div>Poivrons</div><canvas width="360" height="100" role="img" aria-label="Quatre plants de poivrons aux fruits lobés, verts puis rouges, jaunes ou orangés."></canvas></div>
 <div class="crop-row"><div>Aubergines</div><canvas width="360" height="100" role="img" aria-label="Quatre plants d'aubergines aux fruits violets brillants et aux larges feuilles."></canvas></div>
</div>
<style>
 #farm-crops-third .crop-row{margin-top:12px}
 #farm-crops-third canvas{display:block;width:100%;height:auto;image-rendering:pixelated;margin-top:6px}
</style>
<script>
(() => {
 const root=document.getElementById('farm-crops-third'),slider=root.querySelector('[data-growth]'),age=root.querySelector('[data-age]'),play=root.querySelector('[data-play]'),windSwitch=root.querySelector('[data-wind]');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;windSwitch.checked=!reduced;
 const clamp=x=>Math.max(0,Math.min(1,x));
 const smooth=(a,b,g)=>{const p=clamp((g-a)/(b-a));return p*p*(3-2*p);};
 const hash=(s,k)=>{let n=Math.imul(s+13,k+713)^0x68bc21eb;n=Math.imul(n^(n>>>16),0x45d9f3b);return ((n^(n>>>16))>>>0)/4294967296;};
 const vent={direction:1,speed:16,wavelength:320,strength:1.1};
 let time=0,growth=1,playing=false,last=0,ctx;
 const windAt=x=>windSwitch.checked?vent.direction*vent.strength*Math.pow(.5+.5*Math.cos(2*Math.PI*(x-vent.speed*time)/vent.wavelength),2):0;
 // Draw stable pixel silhouettes; animate the whole plant at higher display resolution.
 const breeze=()=>0;
 const RES=3;
 function rect(x,y,w,h,c){if(w<=0||h<=0)return;ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
 function poly(pts,c){
  const ys=pts.map(p=>p[1]);
  for(let y=Math.ceil(Math.min(...ys));y<=Math.max(...ys);y++){
   const hits=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y))hits.push(a[0]+(y-a[1])*(b[0]-a[0])/(b[1]-a[1]));}
   hits.sort((a,b)=>a-b);for(let i=0;i+1<hits.length;i+=2)rect(Math.ceil(hits[i]),y,Math.max(1,Math.floor(hits[i+1])-Math.ceil(hits[i])),1,c);
  }
 }
 function line(x,y,X,Y,w,c){const n=Math.ceil(Math.max(Math.abs(X-x),Math.abs(Y-y)));for(let i=0;i<=n;i++)rect(x+(X-x)*i/Math.max(1,n),y+(Y-y)*i/Math.max(1,n),w,w,c);}
 function oval(x,y,rx,ry,c){if(rx<.4||ry<.4)return;for(let j=-Math.floor(ry);j<=ry;j++){const w=Math.sqrt(Math.max(0,1-j*j/(ry*ry)))*rx;rect(x-w,y+j,w*2,1,c);}}
 function mix(a,b,t){return '#'+[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-t)+parseInt(b.slice(i,i+2),16)*t).toString(16).padStart(2,'0')).join('');}
 const greens=[['#21573d','#398949','#69b654','#b7df87'],['#205c47','#3c9460','#79bf76','#c5e8a0'],['#305e35','#4c9444','#88bd55','#d0e695'],['#20553f','#318551','#68b36a','#b4df98']];
 // A pointed, slightly toothed leaf with a lighter upper plane and visible midrib.
 function leaf(x,y,dx,dy,width,pal){
  const len=Math.hypot(dx,dy);if(len<1)return;
  const nx=-dy/len*width,ny=dx/len*width;
  const P=(u,v)=>[x+dx*u+nx*v,y+dy*u+ny*v];
  poly([P(0,0),P(.25,-.65),P(.38,-.52),P(.49,-1),P(.62,-.65),P(.76,-.72),P(1,0),P(.74,.65),P(.62,.52),P(.45,.9),P(.3,.5)],pal[0]);
  poly([P(.1,0),P(.3,-.4),P(.5,-.75),P(.74,-.4),P(.95,0),P(.55,.37),P(.3,.32)],pal[1]);
  poly([P(.15,0),P(.52,-.55),P(.85,-.2),P(.6,0)],pal[2]);
  line(...P(.08,0),...P(.88,0),1,pal[2]);
 }
 function sprout(x,y,g,pal,s){
  const a=smooth(.025,.19,g),h=9*a;
  if(a<=0)return;
  const dx=breeze(x)*a*.4;line(x,y,x+dx,y-h,1,pal[0]);
  leaf(x+dx,y-h+1,-7*a,-3*a,2*a,pal);leaf(x+dx,y-h,6*a,-4*a,2*a,pal);
 }
 function zucchini(x,y,g,s,pal){
  sprout(x,y,g,pal,s);
  for(let i=0;i<6;i++){
   const a=smooth(.07+i*.035,.5+i*.05,g),angle=-2.8+i*.48,L=(26+hash(s,i+51)*8)*a;
   if(a===0)continue;const dx=Math.cos(angle)*L,dy=Math.sin(angle)*L;
   line(x,y-3,x+dx*.65,y+dy*.65,2*a,pal[1]);
   leaf(x+dx*.25,y+dy*.25,dx*.8,dy*.8,10*a,pal);
  }
  for(let i=0;i<2;i++){
   const a=smooth(.49+i*.06,.97,g),side=i?1:-1;
   const bx=x+side*5,by=y-7-i*3;
   if(g>.39+i*.04&&a<.15){oval(bx+side*6,by,3,2,'#ffc76c');rect(bx+side*6,by-3,2,5,'#ffe59a');}
   if(a<=0)continue;
   const len=(19+hash(s,i+71)*6)*a,r=(4+hash(s,i+81))*a;
   const P=(u,v)=>[bx+side*u*len,by+u*5+v*r];
   poly([P(0,-.6),P(.2,-1),P(.8,-1),P(1,-.5),P(1,.5),P(.8,1),P(.15,1),P(0,.5)],'#28583c');
   poly([P(.08,-.5),P(.25,-.8),P(.83,-.7),P(.95,-.2),P(.85,.6),P(.15,.5)],['#468653','#53965c','#3a7e4b','#5a9860'][s%4]);
   line(...P(.17,-.4),...P(.82,-.4),1,'#b0cc77');line(...P(.13,.25),...P(.8,.3),1,'#80b367');
   rect(bx-1,by-2,3,3,pal[1]);
  }
 }
 function fruitPlant(x,y,g,s,pal,egg){
  sprout(x,y,g,pal,s);const a=smooth(.1,.6,g);if(a===0)return;
  const h=(39+hash(s,31)*10)*a,lean=(hash(s,32)-.5)*6;
  line(x,y,x+lean,y-h,2,pal[0]);line(x,y,x+lean,y-h,1,pal[2]);
  const sites=[];
  for(let i=0;i<6;i++){
   const b=smooth(.12+i*.045,.43+i*.055,g),side=i%2?1:-1,u=.26+i*.12;
   if(b===0)continue;const bx=x+lean*u,by=y-h*u,dx=side*(12+hash(s,i+91)*5)*b,dy=-6*b;
   line(bx,by,bx+dx,by+dy,1,pal[1]);
   leaf(bx+dx*.55,by+dy*.55,side*(egg?14:11)*b,-9*b,(egg?7:5)*b,pal);
   if(i<3)sites.push({x:bx+dx*.85,y:by+dy+2,i});
  }
  leaf(x+lean,y-h,5*a,-11*a,5*a,pal);
  for(const f of sites){
   const b=smooth(.53+f.i*.055,.9+f.i*.025,g),bloom=smooth(.39+f.i*.04,.49+f.i*.04,g);
   if(bloom===0)continue;
   if(b<.12){oval(f.x,f.y,3*bloom,2*bloom,egg?'#d2afe7':'#fff0cb');rect(f.x-1,f.y-1,2,2,'#f4d578');continue;}
   const ripe=smooth(.73,.98,g),w=(egg?5:6)*b*(.9+hash(s,f.i+141)*.2),h=(egg?14:10)*b*(.85+hash(s,f.i+151)*.25);
   const color=egg?['#775294','#865ba3','#68448a','#925ba1'][s%4]:['#e76955','#edb64e','#ef9356','#de635b'][s%4];
   if(egg){
    oval(f.x+1,f.y+h*.55,w,h*.65,'#443252');oval(f.x,f.y+h*.5,w*.82,h*.58,mix('#82a365',color,ripe));
    oval(f.x-w*.25,f.y+h*.35,w*.34,h*.36,mix('#b9cf8b','#ba91cb',ripe));line(f.x-w*.32,f.y+h*.14,f.x-w*.32,f.y+h*.4,1,'#e2c5e3');
   }else{
    for(let j=-1;j<=1;j++){
     const cx=f.x+j*w*.55,cy=f.y+h*.5+Math.abs(j)*b;
     oval(cx,cy,w*.6,h*.65,mix('#376c40','#9d4b3e',ripe));oval(cx-.5,cy-1,w*.48,h*.55,mix('#6bad58',color,ripe));
     if(j<1)line(cx-1,cy-h*.27,cx-1,cy+h*.13,1,mix('#b2d583','#ffda94',ripe));
    }
   }
   leaf(f.x,f.y,-4*b,-2*b,2*b,pal);leaf(f.x,f.y,4*b,-2*b,2*b,pal);rect(f.x,f.y-3*b,1,4*b,pal[0]);
  }
 }
 const pepper=(x,y,g,s,pal)=>fruitPlant(x,y,g,s,pal,false);
 const eggplant=(x,y,g,s,pal)=>fruitPlant(x,y,g,s,pal,true);
 const rows=[...root.querySelectorAll('canvas')].map((canvas,index)=>{
  const bg=document.createElement('canvas');bg.width=canvas.width;bg.height=canvas.height;ctx=bg.getContext('2d');
  rect(0,0,360,bg.height,'#bbd39a');
  for(let i=0;i<950;i++){const x=hash(21,i)*360,y=hash(22,i)*bg.height;rect(x,y,1+hash(23,i)*2,1,['#bed69f','#b6ce95','#c2d7a3'][i%3]);}
  const base=canvas.height-17;
  for(let j=0;j<4;j++){
   const x=46+j*89;oval(x+1,base+4,32,8,'#70a557');oval(x,base+1,30,8,'#956c4c');oval(x,base-1,29,7,'#b3875a');
   for(let i=0;i<90;i++){const a=hash(j+40,i)*Math.PI*2,r=Math.sqrt(hash(j+60,i));rect(x+Math.cos(a)*r*27,base-1+Math.sin(a)*r*5,1+(i%3===0),1,i%2?'#c69a69':'#9c734d');}
  }
  const plants=document.createElement('canvas');plants.width=360;plants.height=bg.height;
  const enlarged=document.createElement('canvas');enlarged.width=360*RES;enlarged.height=bg.height*RES;
  canvas.width=enlarged.width;canvas.height=enlarged.height;
  return {canvas,bg,base,index,plants,enlarged,cachedGrowth:-1};
 });
 function render(){for(const row of rows){
  if(row.cachedGrowth!==growth){
   ctx=row.plants.getContext('2d');ctx.clearRect(0,0,360,row.plants.height);
   for(let i=0;i<4;i++){const x=46+i*89;if(growth<.055)rect(x-1,row.base,3,1,'#e1ba79');[zucchini,pepper,eggplant][row.index](x,row.base,growth,100+i*17,greens[i]);}
   const big=row.enlarged.getContext('2d');big.clearRect(0,0,row.enlarged.width,row.enlarged.height);big.imageSmoothingEnabled=false;big.drawImage(row.plants,0,0,row.enlarged.width,row.enlarged.height);row.cachedGrowth=growth;
  }
  ctx=row.canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(row.bg,0,0,row.canvas.width,row.canvas.height);
  // Continuous anchored transform, not independently rounded leaf/pixel positions.
  for(let i=0;i<4;i++){
   const x=46+i*89,left=i*89,span=i===3?93:89;
   const shear=-windAt(x)*smooth(.1,.7,growth)/(row.index===0?58:row.index===1?38:65);
   ctx.save();ctx.translate(x*RES,row.base*RES);ctx.transform(1,0,shear,1,0,0);ctx.imageSmoothingEnabled=true;
   ctx.drawImage(row.enlarged,left*RES,0,span*RES,row.canvas.height,(left-x)*RES,-row.base*RES,span*RES,row.canvas.height);ctx.restore();
  }
 }}
 function update(){slider.value=(growth*100).toFixed(1);age.textContent=Math.round(growth*100)+' %';}
 slider.addEventListener('input',()=>{playing=false;play.textContent='Voir la pousse';growth=Number(slider.value)/100;update();render();});
 play.addEventListener('click',()=>{playing=!playing;if(playing&&growth>=1)growth=0;play.textContent=playing?'Arrêter la pousse':'Voir la pousse';update();render();});
 windSwitch.addEventListener('change',render);
 function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;time+=dt;if(playing){growth=Math.min(1,growth+dt/26);if(growth>=1){playing=false;play.textContent='Revoir la pousse';}update();}render();if(root.isConnected)requestAnimationFrame(frame);}
 render();requestAnimationFrame(frame);
})();
</script>
