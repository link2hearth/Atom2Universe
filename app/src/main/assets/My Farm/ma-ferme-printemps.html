<div id="farm-spring-preview">
  <canvas width="480" height="330" role="img" aria-label="Proposition pixel art : prairie verte, fleurs pastel, clôture dorée, portail animé, chemins texturés, rochers et buissons variés.">Aperçu animé du décor de Ma Ferme.</canvas>
  <div class="viz-controls">
    <button type="button" class="btn" data-gate>Ouvrir le portail</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-wind checked><span class="form-check-label">Vent léger</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-pause><span class="form-check-label">Pause</span></label>
  </div>
</div>
<style>
 #farm-spring-preview canvas { display:block; width:100%; height:auto; image-rendering:pixelated; margin-bottom:12px; }
</style>
<script>
(() => {
  const root = document.getElementById('farm-spring-preview');
  const canvas = root.querySelector('canvas'), screen = canvas.getContext('2d');
  const ground = document.createElement('canvas'); ground.width=480; ground.height=330;
  let ctx = ground.getContext('2d');
  let seed=73071;
  const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296;};
  const ir=(a,b)=>Math.floor(a+rnd()*(b-a));
  const pick=a=>a[ir(0,a.length)];
  function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
  function poly(points,c){
    const ys=points.map(p=>p[1]);
    for(let y=Math.ceil(Math.min(...ys));y<Math.max(...ys);y++){
      const hits=[];
      for(let i=0;i<points.length;i++){
        const a=points[i],b=points[(i+1)%points.length];
        if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y))hits.push(a[0]+(y-a[1])*(b[0]-a[0])/(b[1]-a[1]));
      }
      hits.sort((a,b)=>a-b);
      for(let i=0;i+1<hits.length;i+=2)rect(Math.ceil(hits[i]),y,Math.max(1,Math.floor(hits[i+1])-Math.ceil(hits[i])),1,c);
    }
  }
  function oval(x,y,rx,ry,c){for(let j=-ry;j<=ry;j++){const w=Math.sqrt(Math.max(0,1-j*j/(ry*ry)))*rx;rect(x-w,y+j,w*2,1,c);}}
  function line(x,y,X,Y,w,c){const n=Math.ceil(Math.max(Math.abs(X-x),Math.abs(Y-y)));for(let i=0;i<=n;i++)rect(x+(X-x)*i/Math.max(1,n),y+(Y-y)*i/Math.max(1,n),w,w,c);}
  const grass=['#74bb60','#7cc45f','#82c862','#8acd66','#91d16b','#86c565'];
  // One travelling field for every plant: left to right, a 16-second gust cycle.
  const vent={direction:1, speed:20, wavelength:320, strength:1.7};
  function windAt(x,y,t){
    if(!wind.checked)return 0;
    const phase=2*Math.PI*(x*vent.direction-vent.speed*t)/vent.wavelength;
    const gust=.5+.5*Math.cos(phase);
    return vent.direction*vent.strength*gust*gust;
  }
  function trailDistance(x,y){
    const spine=246+12*Math.sin(x/72);
    // End the branch INSIDE the main lane; blend their union before drawing its edge.
    const sy=Math.max(185,Math.min(239,y)),spur=243+8*Math.sin(sy/34);
    const a=Math.abs(y-spine),b=Math.hypot((x-spur)*1.15,y-sy);
    const h=Math.max(0,10-Math.abs(a-b))/10;
    return Math.min(a,b)-h*h*2.5;
  }
  // The shared world-coordinate field has no tile borders, no seams and no frame randomness.
  for(let y=0;y<330;y+=2)for(let x=0;x<480;x+=2){
    const n=Math.sin(x/31+y/48)+Math.sin(y/22-x/67)+rnd()*.6;
    rect(x,y,2,2,grass[Math.max(0,Math.min(5,Math.floor(n+2.4)))]);
  }
  for(let i=0;i<6400;i++){
    const x=ir(0,480),y=ir(0,330);
    rect(x,y,ir(1,4),1,pick(['#91d16b','#9bd574','#6bb65c','#80c262']));
  }
  for(let y=173;y<284;y++)for(let x=0;x<480;x++){
    const d=trailDistance(x,y), edge=17+1.4*Math.sin(x*.31)+1.3*Math.sin(y*.43+x*.17);
    if(d<edge+3&&rnd()>.12)rect(x,y,1,1,'#70a653');
    if(d<edge){const r=rnd();rect(x,y,1,1,d>edge-2?'#b0ac65':r<.08?'#d5b57c':r<.19?'#efd299':'#e4c38b');}
  }
  for(let i=0;i<530;i++){
    const x=ir(0,480),y=ir(180,280);
    if(trailDistance(x,y)<13){rect(x,y,ir(1,4),1,pick(['#caab77','#f4daa3','#d7b984']));if(i%9===0){rect(x,y,3,2,'#bba17a');rect(x,y,2,1,'#f6deb0');}}
  }
  // A quiet clearing leaves room for crops in the eventual Android version.
  for(let i=0;i<1700;i++){
    const x=ir(120,351),y=ir(76,189);
    if(rnd()<.3)rect(x,y,2,1,'#9cd572');
  }
  function bed(x,y){
    poly([[x,y+4],[x+59,y],[x+63,y+28],[x+2,y+32]],'#76a85a');
    rect(x,y,58,28,'#987051');rect(x+2,y,54,25,'#b3845b');
    for(let r=0;r<4;r++){rect(x+4,y+3+r*6,49,2,'#916847');rect(x+4,y+5+r*6,49,1,'#ca9a6c');}
    for(let i=0;i<70;i++)rect(x+ir(3,54),y+ir(1,24),1,1,pick(['#d1a16f','#a67953']));
  }
  bed(139,100);bed(269,100);bed(139,145);bed(269,145);
  const blades=[];
  for(let i=0;i<610;i++){
    const x=ir(6,474),y=ir(8,323);
    if(trailDistance(x,y)<21 || (x>107&&x<366&&y>49&&y<207))continue;
    blades.push({x,y,h:ir(3,8),p:rnd()*6.28,flower:rnd()<.19,color:pick(['#ffe8b0','#ffd0df','#e0d0ff','#fff2d7','#bfe8ef'])});
  }
  function tuft(x,y,h,phase,t,flower,color){
    const sway=Math.round(windAt(x,y,t)*(.65+h*.05));
    rect(x-3,y,7,2,'#69a657');
    line(x,y,x+sway,y-h,1,'#4c9958');
    line(x-1,y,x-4+sway,y-h+2,1,'#a8df7b');
    line(x+1,y,x+4+sway,y-h+1,1,'#5ca754');
    rect(x+sway,y-h,1,3,'#c0e989');
    if(flower){const fx=x+sway,fy=y-h-1;rect(fx-2,fy-1,5,3,color);rect(fx-1,fy-2,3,5,color);rect(fx,fy,1,1,'#e8af54');rect(fx,fy+1,1,1,'#ffe28b');}
  }
  function rock(x,y,s,v){
    oval(x+2,y+1,s+4,4,'#659e57');
    const shape=[[-1,0],[-.95,-.52],[-.55,-.93],[.18,-1.1],[.83,-.75],[1,-.24],[.62,.07]];
    poly(shape.map(([a,b])=>[x+a*s,y+b*s*(v===1?.8:1)]),'#777e8c');
    poly([[x-s+2,y-s*.5],[x-s*.5,y-s*.9],[x+s*.16,y-s*1.02],[x+s*.66,y-s*.65],[x+s*.25,y-s*.27],[x-s*.65,y-s*.17]],'#b8bdc8');
    poly([[x-s*.5,y-s*.88],[x+s*.16,y-s],[x+s*.45,y-s*.72],[x-s*.12,y-s*.62]],'#e0dbd6');
    poly([[x+s*.3,y-s*.3],[x+s*.75,y-s*.59],[x+s*.82,y-s*.2],[x+s*.43,y-s*.04]],'#969ba9');
    rect(x-s*.5,y-s*.8,4,2,'#eef0df');
    if(v!==1){rect(x-s+2,y-3,s*.6,3,'#5ca76a');rect(x-s+4,y-4,s*.5,2,'#a1d879');}
  }
  function paintBush(x,y,s,id){
    oval(x,y+2,s,5,'#579756');
    for(let i=0;i<5;i++){
      const bx=x+Math.sin(i*2.7+id)*s*.5,by=y-5-i*3;
      oval(bx,by,s*.62,s*.49,'#327e58');oval(bx-1,by-3,s*.55,s*.43,'#439b60');
      oval(bx-3,by-5,s*.43,s*.31,'#6dbb69');
      for(let j=0;j<9;j++){
        const a=Math.sin(j*12.3+i*4+id),b=Math.cos(j*7.7+i*2);
        rect(bx+a*s*.37-2,by-5+b*s*.23,3+(j%3),2,j%3===0?'#b2dc7e':'#86cd72');
      }
      if(id%2===0&&i%2===0){rect(bx+3,by-3,3,3,'#f0bad3');rect(bx+4,by-2,1,1,'#ffe3a0');}
    }
  }
  const bushImages=new Map();
  function bush(x,y,s,id,t){
    if(!bushImages.has(id)){
      const sprite=document.createElement('canvas');sprite.width=80;sprite.height=80;
      const previous=ctx;ctx=sprite.getContext('2d');paintBush(40,72,s,id);ctx=previous;
      bushImages.set(id,sprite);
    }
    const sprite=bushImages.get(id),bend=windAt(x,y,t)*1.4;
    // Bend the complete canopy by height, keeping roots AND shadow perfectly still.
    for(let row=0;row<80;row++){
      const height=Math.max(0,(72-row)/32);
      const dx=Math.round(bend*height*height);
      ctx.drawImage(sprite,0,row,80,1,x-40+dx,y-72+row,80,1);
    }
  }
  function post(x,y){
    oval(x+4,y+2,8,3,'#629a50');
    poly([[x-5,y],[x-5,y-27],[x-3,y-30],[x-1,y-31],[x+2,y-31],[x+4,y-30],[x+6,y-27],[x+6,y]],'#825436');
    rect(x-3,y-26,7,25,'#cd9048');rect(x-3,y-25,3,23,'#f0bd69');rect(x+3,y-24,2,23,'#ac6c36');
    poly([[x-4,y-27],[x-2,y-29],[x+2,y-29],[x+4,y-27],[x+5,y-26],[x+3,y-23],[x-3,y-23]],'#ffdb8b');
    rect(x-4,y-8,9,3,'#e8ad59');rect(x-3,y-8,7,1,'#ffce7b');rect(x-1,y-20,1,8,'#d89f52');
  }
  function rail(x,y,X,Y){
    for(const dy of [-19,-8]){
      poly([[x,y+dy],[X,Y+dy],[X,Y+dy+5],[x,y+dy+5]],'#8e5e36');
      line(x,y+dy,X,Y+dy,3,'#e7aa58');line(x,y+dy,X,Y+dy,1,'#ffcf7c');
    }
  }
  function fenceBack(){
    for(let x=111;x<363;x+=36)rail(x,70,x+36,70);
    for(let x=111;x<=363;x+=36)post(x,70);
    for(let y=70;y<190;y+=30){rail(111,y,111,y+30);rail(363,y,363,y+30);}
    for(let y=100;y<=190;y+=30){post(111,y);post(363,y);}
  }
  function gate(open){
    const angle=open*1.18,w=Math.cos(angle)*54,depth=Math.sin(angle)*27;
    const x=219,y=190;
    poly([[x,192],[x+w+8,192+depth],[x+w+12,196+depth],[x+2,196]],'#699d54');
    const p=(u,v)=>[x+u*w,y+u*depth+v];
    // A solid timber panel, with thickness perpendicular to the rotating face.
    const back=(u,v)=>[x+u*w-Math.sin(angle)*5,y+u*depth+v+Math.cos(angle)*2.5];
    const outline=[[0,-24],[.1,-28],[.9,-28],[1,-24],[1,0],[0,0]];
    poly(outline.map(([u,v])=>back(u,v)),'#855532');
    poly([p(0,-24),p(.1,-28),p(.9,-28),p(1,-24),p(1,0),p(0,0)],'#865637');
    for(let i=0;i<6;i++){
      const a=i/6+.02,b=(i+1)/6-.015;
      poly([p(a,-25),p(b,-25),p(b,-2),p(a,-2)],i%2?'#dba052':'#e8b063');
      line(...p(a,-24),...p(a,-3),1,'#f9cf82');
    }
    for(const v of [-22,-5])poly([p(0,v),p(1,v),p(1,v+3),p(0,v+3)],'#f7c77b');
    // Project the diagonal brace as a board, rather than a fixed-width screen line.
    poly([p(.06,-7),p(.94,-25),p(.94,-20),p(.06,-2)],'#9a6337');
    poly([p(.06,-7),p(.94,-25),p(.94,-22),p(.06,-4)],'#ffcf80');
    // End grain and illuminated top connect both faces at every opening angle.
    poly([p(1,-24),back(1,-24),back(1,0),p(1,0)],'#ac713d');
    line(...back(1,-23),...back(1,-1),1,'#784d31');
    for(let i=0;i<3;i++){
      const [u,v]=outline[i],[U,V]=outline[i+1];
      poly([p(u,v),p(U,V),back(U,V),back(u,v)],'#f3c77e');
    }
    for(const v of [-21,-7]){rect(x,v+y,6,3,'#525b64');rect(x+1,v+y,2,1,'#a3abb1');}
    const latch=p(.92,-13);rect(latch[0]-1,latch[1],3,4,'#525b64');
  }
  function fenceFront(open){
    for(let x=111;x<219;x+=36)rail(x,190,x+36,190);
    for(let x=273;x<363;x+=30)rail(x,190,x+30,190);
    gate(open);
    for(const x of [111,147,183,219,273,303,333,363])post(x,190);
  }
  const rocks=[[52,184,15,0],[72,190,9,1],[412,121,20,2],[435,129,11,1],[352,299,12,1],[369,306,8,0],[41,61,9,2]];
  const bushes=[[66,106,19,1],[392,58,23,2],[424,194,17,3],[108,302,22,4],[306,34,15,5],[29,291,16,6]];
  ctx=screen;
  let time=0,last=0,opening=0,target=0,paused=false;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wind=root.querySelector('[data-wind]'),pause=root.querySelector('[data-pause]'),button=root.querySelector('[data-gate]');
  wind.checked=!reduced;
  button.addEventListener('click',()=>{target=target?0:1;button.textContent=target?'Fermer le portail':'Ouvrir le portail';if(reduced){opening=target;render();}});
  pause.addEventListener('change',()=>{paused=pause.checked;});
  function render(){
    ctx=screen;screen.imageSmoothingEnabled=false;screen.drawImage(ground,0,0);
    const t=wind.checked?time:0;
    const items=[...blades.map(o=>({y:o.y,draw:()=>tuft(o.x,o.y,o.h,o.p,t,o.flower,o.color)})),...rocks.map(o=>({y:o[1],draw:()=>rock(...o)})),...bushes.map(o=>({y:o[1],draw:()=>bush(...o,t)})),{y:70,draw:fenceBack},{y:210,draw:()=>fenceFront(opening)}];
    items.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
  }
  function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused){time+=dt;const d=target-opening;opening+=Math.sign(d)*Math.min(Math.abs(d),dt*1.1);render();}if(root.isConnected)requestAnimationFrame(frame);}
  render();requestAnimationFrame(frame);
})();
</script>
